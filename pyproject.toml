[project]
name = "aetherflow-video-match-inference"
version = "0.1.0"
description = "Lightweight inference and timeline reconstruction for AetherFlow video matching."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
onnx = [
  "onnxruntime>=1.18",
]

[project.scripts]
aetherflow-video-match-inference = "aetherflow_video_match_inference.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
